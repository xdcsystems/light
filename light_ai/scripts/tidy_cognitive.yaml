# tidy_cognitive.yaml: the config of the second pass of the clang-tidy gate (scripts/tidy_run.sh; #43).
# The main pass is the system clang-tidy 11 with the .clang-tidy files of the tree; LLVM 11 has no
# readability-function-cognitive-complexity (LLVM 12+), so this pass runs only that check with the
# pinned PyPI clang-tidy in light_ai/venv (README, Build). Passed with --config-file: this pass runs this one
# check only, the other checks stay on clang-tidy 11 (#43). LLVM 23 can parse the root .clang-tidy since #93
# (its AnalyzeTemporaryDtors key, ignored by clang-tidy 11, is gone); this pass still uses --config-file.
Checks: '-*,readability-function-cognitive-complexity'
WarningsAsErrors: '*'
HeaderFilterRegex: '.*/light_ai/(src|include|tests)/.*'
CheckOptions:
  - { key: readability-function-cognitive-complexity.Threshold,    value: '20' }  # flag functions above this
  - { key: readability-function-cognitive-complexity.IgnoreMacros, value: true }  # code expanded from a macro is not counted
